# docker-compose.embeddings.yml — CPU embeddings sidecar (opt-in).
#
# Closes the first-boot embeddings gap (TASK-346). Without it the stack still
# boots — memory/vector writes just degrade to non-vector search until an embed
# endpoint exists. Included by
# bootstrap.sh ONLY when EMBED_IMAGE is set in tenant.env.
#
# Runs the local-model-bridge in EMBED-ONLY mode: CPU sentence-transformers
# (all-MiniLM-L6-v2, 384-dim) with NO GPU reservation and NO vLLM chat engine.
# MiniLM is tiny; keeping it on CPU makes a tenant GPU-free.
#
# IMAGE: EMBED_IMAGE is the published ghcr.io/bawthub/embed@sha256:<digest>
# (llm-bawt Dockerfile.embed-cpu, MiniLM baked in; TASK-2448), or
# localhost/bawthub/embed:<sha> from build-local.sh --only embed.

services:
  local-model-bridge:
    image: ${EMBED_IMAGE:?set EMBED_IMAGE to the published ghcr.io/bawthub/embed digest}
    container_name: ${TENANT_NAME:-bawthub}-embed
    dns_search: ["."]  # TASK-1561, see docker-compose.base.yml
    command: ["python", "-m", "local_model_bridge"]
    environment:
      - LOCAL_MODEL_BRIDGE_EMBED_ONLY=1
      - LOCAL_MODEL_EMBED_DEVICE=cpu
      - LOCAL_MODEL_BRIDGE_HEALTH_PORT=8683
      - LOCAL_MODEL_BRIDGE_EMBED_PORT=8684
      - LOCAL_MODEL_EMBED_MODEL=${LOCAL_MODEL_EMBED_MODEL:-all-MiniLM-L6-v2}
      - LLM_BAWT_API_URL=http://app:8642
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # Named volume so MiniLM downloads once and survives repave (mount-free).
      - embed-hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8683/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Point the app at the in-stack embed sidecar. (The app default already
    # targets this hostname; set explicitly so it survives config changes and
    # documents the wiring.) app does NOT depends_on the sidecar — embeddings
    # are optional, the app must boot even if the embed service is slow/down.
    environment:
      - LOCAL_MODEL_EMBED_URL=http://local-model-bridge:8684

volumes:
  embed-hf-cache:
