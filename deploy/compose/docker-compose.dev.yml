# Development tenant: use the VM's own source checkout, not an image build.
# The app venv volume retains synchronized dependencies across recreates. The
# bridge keeps its image venv so repinning the image updates its curated deps.
services:
  app:
    volumes:
      # Setuptools' editable install writes src/*.egg-info in the guest checkout.
      - ${DEV_SOURCE_DIR:?set the VM-local llm-bawt source directory}/src:/app/src
      - ${DEV_SOURCE_DIR}/pyproject.toml:/app/pyproject.toml:ro
      - ${DEV_SOURCE_DIR}/uv.lock:/app/uv.lock:ro
      - ${DEV_SOURCE_DIR}/README.md:/app/README.md:ro
      - ${DEV_SOURCE_DIR}/LICENSE:/app/LICENSE:ro
      - ${DEV_SOURCE_DIR}/server.sh:/app/server.sh:ro
      - dev-app-venv:/app/.venv

  agent-bridge:
    volumes:
      - ${DEV_SOURCE_DIR}/src:/app/src
      - ${DEV_SOURCE_DIR}/pyproject.toml:/app/pyproject.toml:ro
      - ${DEV_SOURCE_DIR}/README.md:/app/README.md:ro
      - ${DEV_SOURCE_DIR}/LICENSE:/app/LICENSE:ro
      # Optional host SSH identity, generated by bootstrap when BRIDGE_SSH=1.
      - ${BRIDGE_SSH_KEY_DIR:?set by bootstrap.sh}:/home/bridge/.ssh:ro

volumes:
  dev-app-venv:
